name: image_publish

# 构建并推送镜像到 Docker Hub
# 前置准备: 在仓库 Settings -> Secrets and variables -> Actions 中添加
#   DOCKERHUB_USERNAME  Docker Hub 用户名
#   DOCKERHUB_TOKEN     Docker Hub Access Token (Read & Write 权限)

on:
  push:
    tags:
      - 'v*' # 匹配 v1.0, v2.1.3 等标签
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read

jobs:
  build-and-push:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      REGISTRY: docker.io
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/wusthelper-loginservice

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 使用 docker-container 驱动, 并缓存 BuildKit 二进制以加速后续运行
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cache-binary: true

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          # Dockerfile 中写死了 GOARCH=amd64 且 CGO_ENABLED=1, 如需 arm64 请先改造 Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 复用 GitHub Actions 缓存服务中的构建层(含 go mod download 层), 跨运行加速
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 关闭 provenance 证明, 避免 Docker Hub 上出现 unknown/unknown 平台条目
          provenance: false

